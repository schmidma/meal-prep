<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#244c3e" />
    <script>
      (() => {
        const root = document.documentElement;
        let choice;
        try {
          choice = localStorage.getItem('meal-prep:theme:v1');
        } catch {
          // Storage is optional; system preference remains available.
        }
        const theme =
          choice === 'dark' || choice === 'light'
            ? choice
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.style.backgroundColor = theme === 'dark' ? '#171f1d' : '#f6f7f2';
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#171f1d' : '#244c3e';
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
